[project]
name = "pitchside"
version = "0.1.0"
description = "Explainable, personalized match intelligence from synthetic football events."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "numpy>=2.0",
  "duckdb>=1.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "agent-framework-core==1.22.0",
  "mcp==2.3.0",
  "agent-framework-foundry==1.15.0",
  "azure-identity>=1.26",
  "azure-storage-blob>=12.31",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitchside"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
